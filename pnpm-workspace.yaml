packages:
  - deploy
allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true
  # Storybook's file watcher; only reached by `storybook dev`.
  "@parcel/watcher": true
blockExoticSubdeps: true
minimumReleaseAge: 4320
trustPolicy: no-downgrade
trustPolicyExclude:
  - lefthook@2.2.2
  - semver@6.3.1
