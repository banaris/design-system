name: Release

# npmjs.com must have this repo + filename registered as a trusted publisher
# before the OIDC publish below can work.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  # Drop this and a pending publish is evicted. actionlint rejects the key.
  queue: max

jobs:
  select-mode:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nemolize/actions/setup@a78b0df6a8df72fe3a12a16e1c608d27ff490950 # v1.4.1

      # Decides between opening a version PR, publishing one that was merged,
      # and doing nothing. Without this the action would skip straight to
      # publishing on a repo with no changeset — which on a package that has
      # never shipped means pushing 0.0.0 on the first merge to main.
      - id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nemolize/actions/setup@a78b0df6a8df72fe3a12a16e1c608d27ff490950 # v1.4.1

      # ci.yml does not run on the PR this opens — GITHUB_TOKEN authors it.
      - run: pnpm run verify

      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nemolize/actions/setup@a78b0df6a8df72fe3a12a16e1c608d27ff490950 # v1.4.1

      # ci.yml runs on this push too, but nothing here can await another
      # workflow. `verify` ends in check:package, which is what proves the
      # exports map matches the artefact about to be packed.
      - run: pnpm run verify

      - id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # Trusted publishing: npm verifies this workflow through OIDC, so no
      # long-lived NPM_TOKEN is stored anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nemolize/actions/setup@a78b0df6a8df72fe3a12a16e1c608d27ff490950 # v1.4.1

      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}

  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          tag="v$version"
          if gh release view "$tag" --json tagName > /dev/null 2> "$RUNNER_TEMP/err"; then
            echo "$tag already has a release"
            exit 0
          fi
          grep -q 'release not found' "$RUNNER_TEMP/err" || { cat "$RUNNER_TEMP/err"; exit 1; }
          awk -v h="## $version" '$0 == h { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "::error::CHANGELOG.md has no notes under \"## $version\""; exit 1; }
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
