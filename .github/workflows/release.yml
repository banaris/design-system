name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

jobs:
  Release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # Required for npm provenance, which package.json opts into.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nemolize/actions/setup@77ba465744c758cc704be356f9fbc48d152baa4c # v1.1.0
      - run: pnpm run build

      # Opens (or updates) a version PR while changesets are pending, and
      # publishes once that PR is merged — so a release is always a reviewed
      # commit rather than a side effect of pushing to main.
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run changeset:version
          publish: pnpm exec changeset publish
          commit: "chore: version the package"
          title: "chore: version the package"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          # The action writes ~/.npmrc from NPM_TOKEN. NODE_AUTH_TOKEN is a
          # setup-node convention and nothing here runs setup-node, so it would
          # publish `_authToken=undefined` and fail only once a version PR merges.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
