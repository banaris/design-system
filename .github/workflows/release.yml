name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

jobs:
  Release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # Required for npm provenance, which package.json opts into.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nemolize/actions/setup@77ba465744c758cc704be356f9fbc48d152baa4c # v1.1.0
      - run: pnpm run build

      # Opens (or updates) a version PR while changesets are pending, and
      # publishes once that PR is merged — so a release is always a reviewed
      # commit rather than a side effect of pushing to main.
      - uses: changesets/action@e0145edc7d9d8679003495b11f87bd8ef63c0cba # v1.5.3
        with:
          version: pnpm run changeset:version
          publish: pnpm exec changeset publish
          commit: "chore: version the package"
          title: "chore: version the package"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
