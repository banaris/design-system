name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancelling an in-progress main run would leave that commit with no CI verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Both jobs call a single package.json script rather than listing the
  # individual checks. Enumerating them here lets CI and local runs drift apart
  # silently — a check added to `verify` would simply never run in CI.
  Verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: nemolize/actions/setup@v1.4.1
      - run: pnpm run verify
      - if: ${{ !cancelled() }}
        id: zizmor-version
        name: Read the zizmor version pinned in mise.toml
        run: |
          version="$(mise current zizmor)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() && steps.zizmor-version.outcome == 'success' }}
        uses: zizmorcore/zizmor-action@v0.8.1
        with:
          version: ${{ steps.zizmor-version.outputs.version }}
          # SARIF upload needs code scanning, which a private repository only
          # gets with GitHub Code Security; off, findings fail this step instead.
          advanced-security: false
      - if: ${{ !cancelled() }}
        name: Verify the workflow lockfile
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.0
          gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}

  Changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "$BASE_SHA"...HEAD > "$RUNNER_TEMP/changed"
          grep -q '^src/' "$RUNNER_TEMP/changed" || { echo "no src/ change, no changeset needed"; exit 0; }
          git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD -- .changeset > "$RUNNER_TEMP/added"
          grep -E '^\.changeset/.+\.md$' "$RUNNER_TEMP/added" | grep -v '^\.changeset/README\.md$' | grep -q . || {
            echo "::error::src/ changed but no changeset was added; run 'pnpm run changeset' (or 'pnpm run changeset --empty' if nothing needs announcing)"
            exit 1
          }

  Accessibility:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      # Without --ipc=host chromium can run out of memory and crash.
      options: --init --ipc=host

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # checkout's own safe.directory lasts only for its step; the `prepare`
      # script (`lefthook install`) that `pnpm install` runs needs it too.
      - run: git config --global --add safe.directory "$(pwd)"
      - uses: nemolize/actions/setup@v1.4.1
      # The image tag can be ahead of `playwright` by days, and Playwright never
      # falls back to another headless-shell revision; this fetches only a missing one.
      - name: Ensure the Chromium headless shell required by the lockfile
        run: pnpm exec playwright install --only-shell chromium
      - run: pnpm run test
      # Proves the run above could have failed. Without it a suite that stopped
      # running axe reports the same green as one that ran it.
      - run: pnpm run check:axe-live
