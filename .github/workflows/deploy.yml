name: Deploy

# Deliberately not gated on CI: publishing the catalogue while a check is red
# has to stay possible.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Queueing production keeps a second push from cancelling a live deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  Build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: nemolize/actions/setup@v1.4.1
      # No `pnpm run build` here: the catalogue reads tokens and components
      # from source, so nothing it serves comes out of `dist/`.
      - run: pnpm run build-storybook

      - name: Upload the catalogue
        uses: actions/upload-artifact@v7.0.2
        with:
          name: catalogue
          path: storybook-static/
          if-no-files-found: error
          # Artifacts are immutable, so a re-run would otherwise fail on the name.
          overwrite: true
          retention-days: 30

  Deploy:
    needs: Build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      # First, so no later step reaches a host outside this list.
      - uses: bullfrogsec/bullfrog@v0.11.1
        with:
          egress-policy: block
          # Raw-IP packets bypass the filter, and sudo is what can send them.
          enable-sudo: false
          # productionresultssa*: artifact storage; accounts beyond the 20 GitHub's Copilot
          # allowlist names do occur (sa31). release-assets.githubusercontent.com: setup-node's Node download.
          allowed-domains: |
            github.com
            api.github.com
            *.actions.githubusercontent.com
            productionresultssa0.blob.core.windows.net
            productionresultssa1.blob.core.windows.net
            productionresultssa2.blob.core.windows.net
            productionresultssa3.blob.core.windows.net
            productionresultssa4.blob.core.windows.net
            productionresultssa5.blob.core.windows.net
            productionresultssa6.blob.core.windows.net
            productionresultssa7.blob.core.windows.net
            productionresultssa8.blob.core.windows.net
            productionresultssa9.blob.core.windows.net
            productionresultssa10.blob.core.windows.net
            productionresultssa11.blob.core.windows.net
            productionresultssa12.blob.core.windows.net
            productionresultssa13.blob.core.windows.net
            productionresultssa14.blob.core.windows.net
            productionresultssa15.blob.core.windows.net
            productionresultssa16.blob.core.windows.net
            productionresultssa17.blob.core.windows.net
            productionresultssa18.blob.core.windows.net
            productionresultssa19.blob.core.windows.net
            productionresultssa20.blob.core.windows.net
            productionresultssa21.blob.core.windows.net
            productionresultssa22.blob.core.windows.net
            productionresultssa23.blob.core.windows.net
            productionresultssa24.blob.core.windows.net
            productionresultssa25.blob.core.windows.net
            productionresultssa26.blob.core.windows.net
            productionresultssa27.blob.core.windows.net
            productionresultssa28.blob.core.windows.net
            productionresultssa29.blob.core.windows.net
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            productionresultssa33.blob.core.windows.net
            productionresultssa34.blob.core.windows.net
            productionresultssa35.blob.core.windows.net
            productionresultssa36.blob.core.windows.net
            productionresultssa37.blob.core.windows.net
            productionresultssa38.blob.core.windows.net
            productionresultssa39.blob.core.windows.net
            registry.npmjs.org
            api.cloudflare.com
            release-assets.githubusercontent.com

      # Deploying from the build's own wrangler config would let it pick what
      # runs here, since a wrangler config can carry an executable build.command.
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            wrangler.json
            mise.toml
            pnpm-workspace.yaml
            pnpm-lock.yaml
            deploy/package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the catalogue
        uses: actions/download-artifact@v8.0.2
        with:
          name: catalogue
          path: storybook-static

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: mise.toml
          package-manager-cache: false

      # From the npm registry, so the egress allowlist gains no host.
      - name: Install the pnpm that mise.toml pins
        run:
          | # zizmor: ignore[adhoc-packages] pnpm itself, at the exact mise.toml pin
          want_pnpm="$(sed -nE "s/^pnpm *= *[\"']([0-9]+\.[0-9]+\.[0-9]+)[\"'].*/\1/p" mise.toml)"
          if [ -z "${want_pnpm}" ]; then
            echo "::error::mise.toml must pin pnpm as an exact x.y.z string, e.g. pnpm = \"12.16.1\""
            exit 1
          fi
          npm install --global --ignore-scripts "pnpm@${want_pnpm}"

      # wrangler-action would otherwise install it itself, after setting the token.
      # Without the root package.json, only deploy/'s dependencies are installed.
      - name: Install wrangler before the token is in scope
        run: pnpm install --frozen-lockfile --ignore-scripts --filter deploy

      - name: Check the Node version against its pin
        run: |
          want_node="$(sed -nE "s/^node *= *[\"']([0-9]+\.[0-9]+\.[0-9]+)[\"'].*/\1/p" mise.toml)"
          if [ -z "${want_node}" ]; then
            echo "::error::mise.toml must pin node as an exact x.y.z string, e.g. node = \"26.13.0\""
            exit 1
          fi
          got_node="$(node --version)"
          echo "node ${got_node} (mise.toml pins ${want_node})"
          test "${got_node}" = "v${want_node}"

      - name: Log the wrangler version
        run: node -p '"wrangler " + require("./deploy/node_modules/wrangler/package.json").version'

      - id: deploy
        name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4.1.3
        env:
          # Its telemetry host is not allowlisted, and the blocked call stalls exit.
          WRANGLER_SEND_METRICS: "false"
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          # With no wranglerVersion, the action uses the wrangler it finds from here.
          workingDirectory: deploy
          command: ${{ github.ref == 'refs/heads/main' && 'deploy -c ../wrangler.json' || 'versions upload -c ../wrangler.json' }}

      - if: ${{ github.event_name == 'pull_request' && steps.deploy.outputs.deployment-url != '' }}
        name: Write the catalogue URL into the PR description
        uses: nemolize/actions/upsert@v1.4.1
        with:
          marker: catalogue
          body: |
            ### Catalogue

            ${{ steps.deploy.outputs.deployment-url }}
          on-empty: skip
