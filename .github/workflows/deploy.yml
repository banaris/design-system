name: Deploy

# Deliberately not gated on CI: publishing the catalogue while a check is red
# has to stay possible.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Queueing production keeps a second push from cancelling a live deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  Catalogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nemolize/actions/setup@77ba465744c758cc704be356f9fbc48d152baa4c # v1.1.0
      # The catalogue reads tokens from source, but a preview should exercise
      # the same stylesheet consumers get.
      - run: pnpm run build
      - run: pnpm run build-storybook

      - id: deploy
        name: Deploy to Cloudflare Workers
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            out="$(pnpm exec wrangler deploy 2>&1)"
          else
            out="$(pnpm exec wrangler versions upload 2>&1)"
          fi
          echo "$out"
          url="$(printf '%s' "$out" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - if: ${{ github.event_name == 'pull_request' && steps.deploy.outputs.url != '' }}
        name: Write the catalogue URL into the PR description
        uses: nemolize/actions/upsert@77ba465744c758cc704be356f9fbc48d152baa4c # v1.1.0
        with:
          marker: catalogue
          body: |
            ### Catalogue

            ${{ steps.deploy.outputs.url }}
          on-empty: skip
