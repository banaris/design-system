name: Deploy

# Deliberately not gated on CI: publishing the catalogue while a check is red
# has to stay possible.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Queueing production keeps a second push from cancelling a live deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  Catalogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nemolize/actions/setup@0a6e86438446cdc086f5dc490688523d8fb8282c # v1.4.0
      # No `pnpm run build` here: the catalogue reads tokens and components
      # from source, so nothing it serves comes out of `dist/`.
      - run: pnpm run build-storybook

      - id: deploy
        name: Deploy to Cloudflare Workers
        run: |
          # Under `bash -e` a bare `out="$(wrangler ...)"` aborts the step with
          # wrangler's diagnostics still trapped in $out, so echo before failing.
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            out="$(pnpm exec wrangler deploy 2>&1)" && rc=0 || rc=$?
          else
            out="$(pnpm exec wrangler versions upload 2>&1)" && rc=0 || rc=$?
          fi
          echo "$out"
          [ "$rc" -eq 0 ] || exit "$rc"
          # grep exits 1 when no URL was printed; 2+ is a real failure.
          url="$(printf '%s' "$out" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)" && grc=0 || grc=$?
          [ "$grc" -le 1 ] || exit "$grc"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - if: ${{ github.event_name == 'pull_request' && steps.deploy.outputs.url != '' }}
        name: Write the catalogue URL into the PR description
        uses: nemolize/actions/upsert@0a6e86438446cdc086f5dc490688523d8fb8282c # v1.4.0
        with:
          marker: catalogue
          body: |
            ### Catalogue

            ${{ steps.deploy.outputs.url }}
          on-empty: skip
